# ===== PostgreSQL (Supabase) =====
spring.datasource.url=jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.qyojumonoucnitctyzzs
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== MongoDB (Atlas) =====
spring.data.mongodb.uri=${MONGODB_URI}

# ===== Supabase Storage =====
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_SECRET_KEY}
supabase.bucket=menu-imagenes

# ===== Límite de tamaño para subida de archivos =====
spring.servlet.multipart.max-file-size=10MB
